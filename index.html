<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ColdWatch</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #0b1220;
  color: white;
  font-family: Arial, sans-serif;
  padding: 20px;
}
header { text-align: center; }
h1 { color: #38bdf8; }
.card {
  background: #172337;
  padding: 20px;
  border-radius: 15px;
  margin: 15px 0;
}
.temp {
  font-size: 48px;
  font-weight: bold;
  color: #38bdf8;
  text-align: center;
}
.status { text-align: center; color: #4ade80; }
input, button {
  padding: 12px;
  border: 0;
  border-radius: 8px;
  margin: 5px 0;
}
button {
  background: #0284c7;
  color: white;
  cursor: pointer;
}
input { width: 100%; }
canvas { max-width: 100%; }
</style>
</head>
<body>

<header>
<h1>❄ ColdWatch</h1>
<p>Monitoramento inteligente de câmara fria</p>
</header>

<div class="card">
<h3>Temperatura atual</h3>
<div class="temp" id="temp">-- °C</div>
<p class="status" id="status">Aguardando conexão</p>
</div>

<div class="card">
<h3>Configuração de temperatura</h3>
<label>Temperatura mínima (°C)</label>
<input type="number" id="min" value="2">
<label>Temperatura máxima (°C)</label>
<input type="number" id="max" value="8">
<button onclick="salvar()">Salvar limites</button>
</div>

<div class="card">
<h3>Histórico de temperatura</h3>
<canvas id="grafico"></canvas>
</div>

<div class="card">
<h3>Conexão do detector</h3>
<p id="conexao">Detector ainda não conectado.</p>
<button onclick="conectar()">Conectar dispositivo</button>
</div>

<script>
let minimo = 2;
let maximo = 8;
let dados = [];
let horarios = [];

const grafico = new Chart(
document.getElementById('grafico'), {
type: 'line',
data: {
labels: horarios,
datasets: [{
label: 'Temperatura °C',
data: dados,
borderColor: '#38bdf8',
tension: 0.3
}]
},
options: {
responsive: true
}
});

function salvar() {
minimo = Number(document.getElementById('min').value);
maximo = Number(document.getElementById('max').value);
alert('Limites salvos!');
}

function atualizar(temperatura) {
document.getElementById('temp').textContent =
temperatura.toFixed(1) + ' °C';

const alerta = temperatura < minimo || temperatura > maximo;

document.getElementById('status').textContent =
alerta ? '⚠ ALERTA: Temperatura fora do limite!' :
'✓ Temperatura normal';

if (alerta && 'Notification' in window &&
Notification.permission === 'granted') {
new Notification('ColdWatch - Alerta', {
body: 'Temperatura fora dos limites: ' + temperatura + ' °C'
});
}

horarios.push(new Date().toLocaleTimeString());
dados.push(temperatura);

if (dados.length > 30) {
dados.shift();
horarios.shift();
}
grafico.update();
}

function conectar() {
document.getElementById('conexao').textContent =
'Para conectar, precisamos configurar a integração Tuya.';
if ('Notification' in window) {
Notification.requestPermission();
}
}
</script>

</body>
</html>
